name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Aligné sur le runtime du projet Vercel (Node 24.x) pour que le build
      # local du workflow corresponde à l'environnement d'exécution.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN absent — déploiement ignoré. Ajoutez le secret dans Settings > Secrets and variables > Actions."
            exit 0
          fi
          bash scripts/deploy.sh production
